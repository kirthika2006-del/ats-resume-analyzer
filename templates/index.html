<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ title }}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="container">
    <h1>🎯 {{ title }}</h1>
    <p class="subtitle">Upload your resume and paste a job description to get an instant ATS match score.</p>

    <form id="analyzeForm">
      <label for="resume">Resume (PDF)</label>
      <input type="file" id="resume" name="resume" accept="application/pdf" required>

      <label for="job_description">Job Description</label>
      <textarea id="job_description" name="job_description" rows="8" placeholder="Paste the job description here..." required></textarea>

      <button type="submit" id="submitBtn">Analyze Resume</button>
    </form>

    <div id="loader" class="hidden">Analyzing... please wait ⏳</div>

    <div id="result" class="hidden">
      <h2>Analysis Result</h2>
      <div id="resultContent"></div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
